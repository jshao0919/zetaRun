name: Android checks and debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/zetarun-android-sdk"
          cli_archive="$RUNNER_TEMP/zetarun-android-cli.zip"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$cli_archive"
          printf '%s  %s\n' '5fdcc763663eefb86a5b8879697aa6088b041e70' "$cli_archive" | sha1sum --check
          mkdir -p "$sdk_dir/cmdline-tools" "$RUNNER_TEMP/zetarun-android-cli"
          unzip -q "$cli_archive" -d "$RUNNER_TEMP/zetarun-android-cli"
          mv "$RUNNER_TEMP/zetarun-android-cli/cmdline-tools" "$sdk_dir/cmdline-tools/19.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_dir/cmdline-tools/19.0/bin" "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
          python3 - "$sdk_dir" <<'PY'
          import subprocess, sys
          sdk = sys.argv[1]
          subprocess.run(
              [sdk + "/cmdline-tools/19.0/bin/sdkmanager", "--sdk_root=" + sdk, "--licenses"],
              input="y\n" * 200, text=True, check=True,
          )
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-en-us
          key: vosk-official-2021-04-70b354708afbbbe8
      - name: Prepare verified offline models
        run: ./scripts/prepare-model.sh
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Check native and ZIP alignment
        run: |
          python3 scripts/check_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZetaRun-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
